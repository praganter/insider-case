services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Bound to localhost only: the default password is a dev value.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  # Run by `make test`; uses the default "postgres" database so the seed test
  # cannot wipe the dev data in "app".
  test:
    profiles: [test]
    build: { context: backend, target: test }
    command: ["sh", "scripts/test.sh"]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/postgres?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  test-frontend:
    profiles: [test]
    build: { context: frontend, target: build }
    command: ["npm", "test"]

  seed:
    build: { context: backend, args: { CMD: seed } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: backend, args: { CMD: api } }
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      REDIS_ADDR: redis:6379
    ports: ["8080:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  mockprovider:
    build: { context: backend, args: { CMD: mockprovider } }
    environment:
      ERROR_RATE: ${PROVIDER_ERROR_RATE:-0.05}
      TOO_MANY_RATE: ${PROVIDER_TOO_MANY_RATE:-0.05}
      DELAY_MS: 20
      LIMIT_PER_SEC: 100

  worker:
    build: { context: backend, args: { CMD: worker } }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      REDIS_ADDR: redis:6379
      PROVIDER_URL: http://mockprovider:9090
      RATE_PER_SEC: 100
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mockprovider: { condition: service_started }

  frontend:
    build: frontend
    ports: ["3000:80"]
    depends_on:
      - api

volumes:
  pgdata:
