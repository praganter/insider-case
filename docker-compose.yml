services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  # Run by `make test`; uses the default "postgres" database so the seed test
  # cannot wipe the dev data in "app".
  test:
    profiles: [test]
    build: { context: backend, target: build }
    command: ["sh", "scripts/test.sh"]
    environment:
      TEST_DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    build: { context: backend, args: { CMD: seed } }
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: backend, args: { CMD: api } }
    env_file:
      - path: .env
        required: false
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app?sslmode=disable
      REDIS_ADDR: redis:6379
    ports: ["8080:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
