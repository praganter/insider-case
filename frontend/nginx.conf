server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/x -> api:8080/x. Buffering is off so SSE events reach the browser as they happen.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
